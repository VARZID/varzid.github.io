<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАРЗИД - Чемпионати Футболи Фархор</title>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2530;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #2a3441;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 20px; font-weight: bold; color: var(--accent-color); letter-spacing: 1px; }
        .location { font-size: 12px; color: var(--text-muted); }
        .container { padding: 15px; }
        .divisions-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .divisions-scroll::-webkit-scrollbar { display: none; }
        .div-btn { background-color: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
        .div-btn.active { background-color: var(--accent-color); color: #000; font-weight: bold; border-color: var(--accent-color); }
        .table-card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        th, td { padding: 10px 6px; }
        th { background-color: #252e3e; color: var(--text-muted); font-weight: 600; }
        tr:not(:last-child) td { border-bottom: 1px solid var(--border-color); }
        td.team-name { text-align: left; padding-left: 10px; font-weight: 500; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .nav-item.active { color: var(--accent-color); }
        .nav-item span.icon { font-size: 18px; margin-bottom: 2px; }
        .section { display: none; }
        .section.active { display: block; }
        .admin-box { background-color: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        .admin-box h3 { font-size: 15px; margin-bottom: 10px; color: var(--accent-color); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group select, .form-group input { width: 100%; padding: 8px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }
        .submit-btn { background-color: var(--accent-color); color: #000; border: none; width: 100%; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="logo">VARZID</div>
            <div class="location">Фархор, Чемпионати Ноҳиявӣ</div>
        </div>
        <div style="font-size: 18px;">⚽</div>
    </header>
    <div class="container">
        <div id="table-section" class="section active">
            <div class="divisions-scroll">
                <button class="div-btn active" onclick="switchDiv('div1')">Лигаи Олӣ (Див 1)</button>
                <button class="div-btn" onclick="switchDiv('div2')">Лигаи Якум (Див 2)</button>
                <button class="div-btn" onclick="switchDiv('north')">Минтақаи Шимол</button>
                <button class="div-btn" onclick="switchDiv('south')">Минтақаи Ҷануб</button>
                <button class="div-btn" onclick="switchDiv('east')">Минтақаи Шарқ</button>
                <button class="div-btn" onclick="switchDiv('west')">Минтақаи Ғарб</button>
            </div>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th style="text-align: left; padding-left: 10px;">Даста</th>
                            <th>Б</th>
                            <th>ГХ</th>
                            <th>Х</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body"></tbody>
                </table>
            </div>
        </div>
        <div id="matches-section" class="section">
            <h3 style="margin-bottom: 10px; font-size: 16px;">Бозиҳои навбатӣ</h3>
            <div class="table-card" style="padding: 15px; font-size: 13px; color: var(--text-muted);">
                Тақвими бозиҳо дар ин ҷо намоиш дода мешавад.
            </div>
        </div>
        <div id="admin-section" class="section">
            <div class="admin-box">
                <h3>Ворид кардани натиҷаи бозӣ</h3>
                <div class="form-group">
                    <label>Дивизион:</label>
                    <select id="admin-div">
                        <option value="div1">Лигаи Олӣ</option>
                        <option value="div2">Лигаи Якум</option>
                        <option value="north">Минтақаи Шимол</option>
                        <option value="south">Минтақаи Ҷануб</option>
                        <option value="east">Минтақаи Шарқ</option>
                        <option value="west">Минтақаи Ғарб</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Дастаи мизбон:</label>
                    <input type="text" id="team-a" placeholder="Масалан: Ҳулбук">
                </div>
                <div class="form-group">
                    <label>Дастаи меҳмон:</label>
                    <input type="text" id="team-b" placeholder="Масалан: Фархор">
                </div>
                <div class="form-group">
                    <label>Шот (Ҳисоб):</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="score-a" placeholder="0">
                        <span style="align-self: center;">:</span>
                        <input type="number" id="score-b" placeholder="0">
                    </div>
                </div>
                <button class="submit-btn" onclick="saveMatch()">Сабт кардани Шот</button>
            </div>
        </div>
    </div>
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('table-section', this)"><span class="icon">📊</span><span>Ҷадвал</span></button>
        <button class="nav-item" onclick="switchTab('matches-section', this)"><span class="icon">📅</span><span>Бозиҳо</span></button>
        <button class="nav-item" onclick="switchTab('admin-section', this)"><span class="icon">⚙️</span><span>Админ</span></button>
    </nav>
    <script>
        let leaguesData = {
            div1: [
                { name: "Ҳулбук", p: 0, gf: 0, ga: 0, pts: 0 },
                { name: "Фархори Марказ", p: 0, gf: 0, ga: 0, pts: 0 },
                { name: "Панҷ", p: 0, gf: 0, ga: 0, pts: 0 },
                { name: "Ваҳдат", p: 0, gf: 0, ga: 0, pts: 0 }
            ],
            div2: [{ name: "Гулшан", p: 0, gf: 0, ga: 0, pts: 0 }, { name: "Баҳор", p: 0, gf: 0, ga: 0, pts: 0 }],
            north: [{ name: "Шимол-1", p: 0, gf: 0, ga: 0, pts: 0 }],
            south: [{ name: "Ҷануб-1", p: 0, gf: 0, ga: 0, pts: 0 }],
            east: [{ name: "Шарқ-1", p: 0, gf: 0, ga: 0, pts: 0 }],
            west: [{ name: "Ғарб-1", p: 0, gf: 0, ga: 0, pts: 0 }]
        };
        let currentActiveDiv = 'div1';
        function renderTable(divKey) {
            currentActiveDiv = divKey;
            const tbody = document.getElementById('standings-body');
            tbody.innerHTML = '';
            let teams = leaguesData[divKey];
            teams.sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga));
            teams.forEach((t, index) => {
                tbody.innerHTML += `<tr><td>${index + 1}</td><td class="team-name">${t.name}</td><td>${t.p}</td><td>${t.gf}:${t.ga}</td><td style="font-weight: bold; color: var(--accent-color);">${t.pts}</td></tr>`;
            });
        }
        function switchDiv(divKey) {
            document.querySelectorAll('.div-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTable(divKey);
        }
        function switchTab(sectionId, btn) {
            document.querySelectorAll('.section').choices = document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            btn.classList.add('active');
        }
        function saveMatch() {
            let div = document.getElementById('admin-div').value;
            let nameA = document.getElementById('team-a').value.trim();
            let nameB = document.getElementById('team-b').value.trim();
            let scoreA = parseInt(document.getElementById('score-a').value) || 0;
            let scoreB = parseInt(document.getElementById('score-b').value) || 0;
            if(!nameA || !nameB) { alert("Лутфан номи дастаҳоро нависед!"); return; }
            let teamAObj = leaguesData[div].find(t => t.name.toLowerCase() === nameA.toLowerCase());
            if(!teamAObj) { teamAObj = { name: nameA, p: 0, gf: 0, ga: 0, pts: 0 }; leaguesData[div].push(teamAObj); }
            let teamBObj = leaguesData[div].find(t => t.name.toLowerCase() === nameB.toLowerCase());
            if(!teamBObj) { teamBObj = { name: nameB, p: 0, gf: 0, ga: 0, pts: 0 }; leaguesData[div].push(teamBObj); }
            teamAObj.p += 1; teamBObj.p += 1;
            teamAObj.gf += scoreA; teamAObj.ga += scoreB;
            teamBObj.gf += scoreB; teamBObj.ga += scoreA;
            if(scoreA > scoreB) { teamAObj.pts += 3; }
            else if(scoreA < scoreB) { teamBObj.pts += 3; }
            else { teamAObj.pts += 1; teamBObj.pts += 1; }
            alert("Натиҷа сабт шуд ва ҷадвал нав гардид!");
            renderTable(currentActiveDiv);
            document.getElementById('team-a').value = '';
            document.getElementById('team-b').value = '';
            document.getElementById('score-a').value = '';
            document.getElementById('score-b').value = '';
        }
        renderTable('div1');
    </script>
</body>
</html>
