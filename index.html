<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID - Магазин</title>
    <script>
        tailwind = { darkMode: 'class' }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 pb-24 transition-colors duration-300">

    <!-- Header (Шапка бо мутавозинсозӣ ва бренди калони муносиб) -->
    <header class="sticky top-0 z-50 bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 px-4 py-3 shadow-sm flex items-center justify-between h-14">
        <!-- Навигатор ва Суроға -->
        <div class="flex items-center space-x-2 cursor-pointer min-w-[100px]">
            <i class="fa-solid fa-location-dot text-emerald-600 text-base flex-shrink-0"></i>
            <div class="flex flex-col justify-center">
                <span class="text-[9px] text-gray-400 block leading-tight">Адрес доставки</span>
                <span class="text-[11px] font-bold text-gray-700 dark:text-gray-200 leading-tight" id="txt-addr">Фархор, Центр</span>
            </div>
        </div>

        <!-- VARZID Бренд (Марказӣ ва мутавозин) -->
        <div class="flex items-center justify-center flex-1 text-center">
            <span class="text-lg font-black tracking-widest text-emerald-600 dark:text-emerald-400">VARZID</span>
        </div>

        <!-- Зангула -->
        <div class="flex items-center justify-end min-w-[100px]">
            <button onclick="toggleNotifications()" class="relative cursor-pointer w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                <i class="fa-regular fa-bell text-gray-700 dark:text-gray-300 text-sm"></i>
                <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
            </button>
        </div>
    </header>

    <!-- Modal Notifications -->
    <div id="modal-notif" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex justify-center items-start pt-16 px-4">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm rounded-2xl p-4 shadow-xl border border-gray-100 dark:border-gray-700">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-gray-800 dark:text-white" id="title-notif">Уведомления</h3>
                <button onclick="toggleNotifications()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-2 text-xs">
                <div class="p-3 bg-emerald-50 dark:bg-emerald-950/40 rounded-xl text-emerald-800 dark:text-emerald-300 border border-emerald-100 dark:border-emerald-900/30">
                    🔔 Добро пожаловать в VARZID!
                </div>
            </div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="px-4 py-2 bg-white dark:bg-gray-900">
        <div class="relative flex items-center">
            <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400 text-sm"></i>
            <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Поиск товаров..." class="w-full bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-white text-xs py-2.5 pl-11 pr-10 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button class="absolute right-3 text-emerald-600">
                <i class="fa-solid fa-qrcode text-sm"></i>
            </button>
        </div>
    </div>

    <!-- 1. TAB: HOME (Главная) -->
    <div id="view-home" class="tab-view">
        <div class="px-4 mt-2 grid grid-cols-3 gap-2">
            <div class="bg-white dark:bg-gray-800 p-2 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center cursor-pointer hover:border-emerald-500 transition">
                <div class="bg-gray-100 dark:bg-gray-700 h-14 rounded-xl flex items-center justify-center text-xl mb-1">🌾</div>
                <span class="text-[11px] font-medium text-gray-700 dark:text-gray-300" id="cat1">Зерно</span>
            </div>
            <div class="bg-white dark:bg-gray-800 p-2 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center cursor-pointer hover:border-emerald-500 transition">
                <div class="bg-gray-100 dark:bg-gray-700 h-14 rounded-xl flex items-center justify-center text-xl mb-1">🌱</div>
                <span class="text-[11px] font-medium text-gray-700 dark:text-gray-300" id="cat2">Удобрения</span>
            </div>
            <div class="bg-white dark:bg-gray-800 p-2 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 text-center cursor-pointer hover:border-emerald-500 transition">
                <div class="bg-gray-100 dark:bg-gray-700 h-14 rounded-xl flex items-center justify-center text-xl mb-1">🐓</div>
                <span class="text-[11px] font-medium text-gray-700 dark:text-gray-300" id="cat3">Корма</span>
            </div>
        </div>

        <main class="px-4 mt-3">
            <!-- Баннер -->
            <div class="bg-gray-900 rounded-2xl p-4 text-white shadow-md relative overflow-hidden">
                <span class="bg-emerald-500 text-white text-[9px] px-2 py-0.5 rounded-full font-medium" id="banner-badge">Скидка 0%</span>
                <h2 class="text-xs font-bold mt-1.5" id="banner-title">Спецпредложение недели</h2>
                <p class="text-[10px] text-gray-400 mt-0.5" id="banner-desc">Лучшие цены с доставкой.</p>
            </div>

            <!-- Tabs -->
            <div class="flex space-x-2 mt-3">
                <button class="bg-gray-900 dark:bg-emerald-600 text-white text-xs px-3.5 py-1.5 rounded-full font-medium" id="tab1">Для вас</button>
                <button class="bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 text-xs px-3.5 py-1.5 rounded-full font-medium" id="tab2">Цены дня</button>
            </div>

            <!-- Products -->
            <div class="grid grid-cols-2 gap-3 mt-3" id="products-list">
                <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col justify-between relative product-card" data-id="1" data-title="Пшеница отборная" data-price="3.20" data-img="🌾">
                    <button onclick="toggleFav('1', this)" class="btn-fav absolute top-3 right-3 text-gray-300 dark:text-gray-600 hover:text-red-500 transition"><i class="fa-solid fa-heart text-sm"></i></button>
                    <div>
                        <div class="bg-gray-100 dark:bg-gray-700 h-24 rounded-xl flex items-center justify-center text-3xl mb-2">🌾</div>
                        <h3 class="text-xs font-medium text-gray-800 dark:text-white" id="p1-title">Пшеница отборная</h3>
                        <p class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mt-1">3.20 TJS <span class="text-[9px] text-gray-400 font-normal">/ кг</span></p>
                    </div>
                    <button onclick="addToCart('1', 'Пшеница отборная', 3.20, '🌾')" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold py-2 rounded-xl transition">В корзину</button>
                </div>

                <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col justify-between relative product-card" data-id="2" data-title="Кукуруза сухая" data-price="2.80" data-img="🌽">
                    <button onclick="toggleFav('2', this)" class="btn-fav absolute top-3 right-3 text-gray-300 dark:text-gray-600 hover:text-red-500 transition"><i class="fa-solid fa-heart text-sm"></i></button>
                    <div>
                        <div class="bg-gray-100 dark:bg-gray-700 h-24 rounded-xl flex items-center justify-center text-3xl mb-2">🌽</div>
                        <h3 class="text-xs font-medium text-gray-800 dark:text-white" id="p2-title">Кукуруза сухая</h3>
                        <p class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mt-1">2.80 TJS <span class="text-[9px] text-gray-400 font-normal">/ кг</span></p>
                    </div>
                    <button onclick="addToCart('2', 'Кукуруза сухая', 2.80, '
