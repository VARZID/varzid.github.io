<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARZID — Маркетплейс</title>
  <!-- Истифодаи Tailwind CSS барои дизайни замонавӣ ва зебо -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .goog-te-banner-frame { display: none !important; }
    body { top: 0 !important; }
  </style>
</head>
<body class="pb-24">

  <!-- Header -->
  <header class="bg-emerald-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="text-xl font-black tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-store text-emerald-400"></i> VARZID
      </div>
      <div class="flex items-center gap-3">
        <select class="bg-emerald-800 text-white text-sm font-semibold px-2 py-1.5 rounded-lg border border-emerald-700 outline-none cursor-pointer" id="languageSelect" onchange="changeLanguage(this.value)">
          <option value="ru" selected>🇷🇺 RU</option>
          <option value="tj">🇹🇯 TJ</option>
          <option value="en">🇬🇧 EN</option>
          <option value="uz">🇺🇿 UZ</option>
        </select>
      </div>
    </div>
  </header>

  <div id="google_translate_element" class="hidden"></div>

  <main class="max-w-4xl mx-auto px-4 pt-4">
    
    <!-- Панели Админ (Пинҳон) -->
    <div id="adminPanel" class="hidden bg-white rounded-2xl shadow-xl p-5 mb-6 border-2 border-emerald-500">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-emerald-900 flex items-center gap-2">
          <i class="fa-solid fa-gear"></i> Панель управления (Админ)
        </h2>
        <button onclick="closeAdmin()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
        <select id="catSelect" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500">
          <option value="🌾 Зерно и корма">🌾 Зерно и корма</option>
          <option value="🥚 Яйца и птица">🥚 Яйца и птица</option>
          <option value="🛢️ Масло и продукты">🛢️ Масло и продукты</option>
          <option value="🛠️ Инструменты и сад">🛠️ Инструменты и сад</option>
          <option value="📦 Прочее">📦 Прочее</option>
        </select>
        <input type="text" id="nameInput" placeholder="Название товара (напр. Тухми ломан)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500">
        <input type="number" id="priceInput" placeholder="Цена (сомони)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500">
        <input type="text" id="weightInput" placeholder="Ед. измерения (напр. 1 л, 50 кг, 1 шт)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500">
        <input type="number" id="qtyInput" placeholder="Количество / Остаток" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500 sm:col-span-2">
      </div>
      <button onclick="addProduct()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">
        <i class="fa-solid fa-plus mr-1"></i> Добавить товар
      </button>
    </div>

    <!-- Заголовок каталога -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-black text-gray-800 flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-emerald-600"></i> Каталог товаров
      </h1>
      <span id="productCount" class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">0 товаров</span>
    </div>

    <!-- Сетка товаров (Модерн) -->
    <div id="productDisplay" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <!-- Товары динамически выводятся здесь -->
    </div>

  </main>

  <!-- Bottom Navigation Bar (Модерн) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-200 shadow-lg z-40">
    <div class="max-w-4xl mx-auto flex justify-around py-3">
      <button onclick="closeAdmin()" class="flex flex-col items-center text-emerald-600 font-semibold text-xs gap-1">
        <i class="fa-solid fa-house text-lg"></i> Главная
      </button>
      <button onclick="closeAdmin()" class="flex flex-col items-center text-gray-500 hover:text-emerald-600 font-semibold text-xs gap-1">
        <i class="fa-solid fa-layer-group text-lg"></i> Каталог
      </button>
      <button onclick="alert('Корзина пока пуста')" class="flex flex-col items-center text-gray-500 hover:text-emerald-600 font-semibold text-xs gap-1">
        <i class="fa-solid fa-cart-shopping text-lg"></i> Корзина
      </button>
      <button onclick="openAdmin()" class="flex flex-col items-center text-gray-500 hover:text-emerald-600 font-semibold text-xs gap-1">
        <i class="fa-solid fa-user-gear text-lg"></i> Кабинет
      </button>
    </div>
  </nav>

  <!-- Scripts -->
  <script type="text/javascript">
    let items = JSON.parse(localStorage.getItem('varzid_items')) || [];
    let isAdmin = false;

    function renderItems() {
      const container = document.getElementById('productDisplay');
      const countBadge = document.getElementById('productCount');
      container.innerHTML = '';
      countBadge.innerText = `${items.length} товаров`;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            <i class="fa-solid fa-box-open text-4xl mb-2"></i>
            <p class="text-sm">Товаров пока нет в каталоге.</p>
          </div>`;
        return;
      }

      items.forEach((item, index) => {
        container.innerHTML += `
          <div class="bg-white rounded-2xl p-3 shadow-sm hover:shadow-md transition border border-gray-100 flex flex-col justify-between relative group">
            <div>
              <span class="text-[10px] font-bold bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md inline-block mb-2">${item.category}</span>
              <h3 class="font-bold text-gray-800 text-sm mb-1 line-clamp-2">${item.name}</h3>
              <div class="text-emerald-600 font-black text-base mb-1">${item.price} <span class="text-xs font-normal">сомони</span></div>
              <div class="text-[11px] text-gray-400 space-y-0.5">
                <div>Фасовка: <span class="text-gray-600 font-medium">${item.weight}</span></div>
                <div>Остаток: <span class="text-gray-600 font-medium">${item.qty}</span></div>
              </div>
            </div>
            
            <button onclick="deleteItem(${index})" class="mt-3 w-full bg-red-50 hover:bg-red-500 text-red-500 hover:text-white text-xs font-bold py-2 rounded-xl transition flex items-center justify-center gap-1 ${isAdmin ? 'flex' : 'hidden'}">
              <i class="fa-solid fa-trash-can"></i> Удалить
            </button>
          </div>
        `;
      });
    }

    function openAdmin() {
      if (isAdmin) {
        document.getElementById('adminPanel').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      
      let pass = prompt("Введите пароль администратора (по умолчанию: 1234):");
      if (pass === "1234") {
        isAdmin = true;
        document.getElementById('adminPanel').classList.remove('hidden');
        renderItems();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (pass !== null) {
        alert("Неверный пароль!");
      }
    }

    function closeAdmin() {
      document.getElementById('adminPanel').classList.add('hidden');
    }

    function addProduct() {
      const category = document.getElementById('catSelect').value;
      const name = document.getElementById('nameInput').value.trim();
      const price = document.getElementById('priceInput').value.trim();
      const weight = document.getElementById('weightInput').value.trim();
      const qty = document.getElementById('qtyInput').value.trim();

      if (!name || !price) {
        alert('Пожалуйста, укажите название и цену товара!');
        return;
      }

      items.push({
        category: category,
        name: name,
        price: price,
        weight: weight || '1 шт',
        qty: qty || '0'
      });

      localStorage.setItem('varzid_items', JSON.stringify(items));
      renderItems();

      document.getElementById('nameInput').value = '';
      document.getElementById('priceInput').value = '';
      document.getElementById('weightInput').value = '';
      document.getElementById('qtyInput').value = '';
      closeAdmin();
    }

    function deleteItem(index) {
      const item = items[index];
      if (confirm(`Вы уверены, что хотите удалить "${item.name}"?`)) {
        items.splice(index, 1);
        localStorage.setItem('varzid_items', JSON.stringify(items));
        renderItems();
      }
    }

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ru',
        includedLanguages: 'ru,tg,en,uz',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function changeLanguage(langCode) {
      if (langCode === 'tj') langCode = 'tg';
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      }
    }

    renderItems();
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
