<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARZID Marketplace</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f8; color: #333; padding-bottom: 70px; }
    header { background: #1b4332; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: bold; }
    .lang-select { padding: 6px 10px; border-radius: 6px; border: none; font-weight: bold; background: #fff; color: #333; cursor: pointer; }
    .container { max-width: 800px; margin: 15px auto; padding: 0 10px; }

    .admin-card {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      border-left: 5px solid #2d6a4f;
      display: none;
    }
    .admin-card h3 { margin-bottom: 12px; color: #1b4332; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .form-grid input, .form-grid select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; }
    .btn-add { background: #2d6a4f; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .product-card { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); position: relative; }
    .cat-badge { background: #e9ecef; color: #495057; font-size: 11px; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    .product-title { font-size: 15px; font-weight: bold; color: #222; margin-bottom: 5px; }
    .product-price { font-size: 16px; font-weight: bold; color: #2d6a4f; margin-bottom: 4px; }
    .product-details { font-size: 12px; color: #666; }
    
    .btn-delete {
      background: #e63946; color: white; border: none; padding: 6px; border-radius: 4px;
      cursor: pointer; font-size: 12px; margin-top: 8px; width: 100%; display: none;
    }

    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; }
    nav.bottom-nav button { background: none; border: none; font-size: 12px; color: #555; cursor: pointer; }

    body { top: 0 !important; }
    .goog-te-banner-frame { display: none !important; }
    .skiptranslate { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo">VARZID</div>
    <div>
      <select class="lang-select" id="languageSelect" onchange="changeLanguage(this.value)">
        <option value="ru" selected>🇷🇺 RU</option>
        <option value="tj">🇹🇯 TJ</option>
        <option value="en">🇬🇧 EN</option>
        <option value="uz">🇺🇿 UZ</option>
      </select>
    </div>
  </header>

  <div id="google_translate_element" style="display:none;"></div>

  <div class="container">
    
    <!-- Панели админ бо рӯйхати тайёри категорияҳо -->
    <div class="admin-card" id="adminPanel">
      <h3>⚙️ Иловаи сареъи мол</h3>
      <div class="form-grid">
        <!-- Рӯйхати тайёри категорияҳо -->
        <select id="catSelect">
          <option value="🌾 Ғалла ва хӯроки чорво">🌾 Ғалла ва хӯроки чорво</option>
          <option value="🥚 Тухм ва парранда">🥚 Тухм ва парранда</option>
          <option value="🛢️ Равған ва маҳсулот">🛢️ Равған ва маҳсулот</option>
          <option value="🛠️ Масолеҳи сохтмон">🛠️ Масолеҳи сохтмон</option>
          <option value="📦 Дигар маҳсулот">📦 Дигар маҳсулот</option>
        </select>
        
        <input type="text" id="nameInput" placeholder="Номи мол (мас: Гандум)">
        <input type="number" id="priceInput" placeholder="Нарх (сомонӣ)">
        <input type="text" id="weightInput" placeholder="Воҳид (мас: 50 кг / 1 л / дона)">
        <input type="number" id="qtyInput" placeholder="Миқдор / Бақия">
      </div>
      <button class="btn-add" onclick="addProduct()">➕ Илова кардан</button>
    </div>

    <h3 style="margin-bottom: 12px;">📦 Каталог товаров</h3>
    <div class="product-grid" id="productDisplay"></div>

  </div>

  <nav class="bottom-nav">
    <button onclick="closeAdmin()">🏠 Главная</button>
    <button onclick="closeAdmin()">📋 Каталог</button>
    <button>🛒 Корзина</button>
    <button onclick="openAdmin()">👤 Кабинет</button>
  </nav>

  <script type="text/javascript">
    let items = JSON.parse(localStorage.getItem('varzid_items')) || [];
    let isAdmin = false;

    function renderItems() {
      const container = document.getElementById('productDisplay');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p style="color:#777;">Товаров пока нет.</p>';
        return;
      }

      items.forEach((item, index) => {
        container.innerHTML += `
          <div class="product-card">
            <span class="cat-badge">${item.category}</span>
            <div class="product-title">${item.name}</div>
            <div class="product-price">${item.price} сомони</div>
            <div class="product-details">
              <strong>Воҳид:</strong> ${item.weight}<br>
              <strong>Бақия:</strong> ${item.qty}
            </div>
            <button class="btn-delete" style="display: ${isAdmin ? 'block' : 'none'};" onclick="deleteItem(${index})">❌ Нест кардан</button>
          </div>
        `;
      });
    }

    function openAdmin() {
      if (isAdmin) {
        document.getElementById('adminPanel').style.display = 'block';
        return;
      }
      
      let pass = prompt("Пароли кабинети админро ворид кунед:");
      if (pass === "1234") {
        isAdmin = true;
        document.getElementById('adminPanel').style.display = 'block';
        renderItems();
        alert("Панели админ фаъол шуд!");
      } else if (pass !== null) {
        alert("Пароли хато!");
      }
    }

    function closeAdmin() {
      document.getElementById('adminPanel').style.display = 'none';
    }

    function addProduct() {
      const category = document.getElementById('catSelect').value;
      const name = document.getElementById('nameInput').value.trim();
      const price = document.getElementById('priceInput').value.trim();
      const weight = document.getElementById('weightInput').value.trim();
      const qty = document.getElementById('qtyInput').value.trim();

      if (!name || !price) {
        alert('Лутфан номи мол ва нархро ворид кунед!');
        return;
      }

      items.push({
        category: category,
        name: name,
        price: price,
        weight: weight || '1 дона/л/кг',
        qty: qty || '0'
      });

      localStorage.setItem('varzid_items', JSON.stringify(items));
      renderItems();

      document.getElementById('nameInput').value = '';
      document.getElementById('priceInput').value = '';
      document.getElementById('weightInput').value = '';
      document.getElementById('qtyInput').value = '';
    }

    function deleteItem(index) {
      const item = items[index];
      const confirmDelete = confirm(`Шумо боварӣ доред, ки "${item.name}"-ро нест кардан мехоҳед?`);

      if (confirmDelete) {
        items.splice(index, 1);
        localStorage.setItem('varzid_items', JSON.stringify(items));
        renderItems();
      }
    }

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ru',
        includedLanguages: 'ru,tg,en,uz',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function changeLanguage(langCode) {
      if (langCode === 'tj') langCode = 'tg';
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      }
    }

    renderItems();
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
