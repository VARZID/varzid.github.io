<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16843a">
  <title>VARZID SCORE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</head>
<body>

<header class="header">
  <h1>VARZID SCORE</h1>
  <div id="adminRole"></div>
  <button id="logoutBtn">Баромадан</button>
</header>

<main>
  <section class="navigation">
    <button onclick="document.getElementById('matchesSection').scrollIntoView()">Бозиҳо</button>
    <button onclick="document.getElementById('leaguesSection').scrollIntoView()">Лигаҳо</button>
    <button onclick="document.getElementById('adminPanel').scrollIntoView()">Админ</button>
  </section>

  <section id="leaguesSection">
    <h2>Лигаҳои Фархор</h2>
    <div id="leagueList">
      <p>Гурӯҳи олии Фархор</p>
      <p>Гурӯҳи шаҳрак</p>
      <h3>Гурӯҳи деҳот</h3>
      <p>Шарқ</p>
      <p>Ғарб</p>
      <p>Шимол</p>
      <p>Ҷануб</p>
    </div>
  </section>

  <section id="matchesSection">
    <h2>Бозиҳо</h2>
    <div id="matchesList"></div>
  </section>

  <section id="adminPanel" hidden>
    <h2>Панели админ</h2>

    <label for="adminLeague">Интихоби гурӯҳ</label>
    <select id="adminLeague"></select>

    <h3>Илова кардани даста</h3>
    <input id="teamName" type="text" placeholder="Номи даста">
    <button id="addTeamBtn">Илова кардани даста</button>

    <h3>Дастаҳо</h3>
    <div id="adminTeams"></div>

    <h3>Илова кардани бозӣ</h3>
    <input id="homeTeam" type="text" placeholder="Дастаи якум">
    <input id="awayTeam" type="text" placeholder="Дастаи дуюм">
    <label for="matchDate">Сана</label>
    <input id="matchDate" type="date">
    <label for="matchTime">Вақт</label>
    <input id="matchTime" type="time">
    <button id="addMatchBtn">Илова кардани бозӣ</button>
  </section>
</main>

<footer>
  <p>VARZID SCORE © 2026</p>
</footer>

</body>
</html>
