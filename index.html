<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID - Интернет-магазин</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white px-4 py-3 shadow-sm flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
                <p class="text-[10px] text-gray-400">Адрес доставки</p>
                <div class="flex items-center space-x-1 cursor-pointer">
                    <span class="text-xs font-semibold text-gray-800">Фархор, Центр</span>
                    <i class="fa-solid fa-chevron-down text-[9px] text-gray-500"></i>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="relative cursor-pointer w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fa-regular fa-bell text-gray-700"></i>
                <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
            </div>
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-gray-100 text-xs font-semibold text-gray-700 py-1.5 px-2.5 rounded-full border-none outline-none cursor-pointer">
                <option value="ru" selected>RU</option>
                <option value="tj">TJ</option>
                <option value="uz">UZ</option>
            </select>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="px-4 py-2 bg-white">
        <div class="relative flex items-center">
            <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400"></i>
            <input type="text" id="search-placeholder" placeholder="Поиск товаров..." class="w-full bg-gray-100 text-sm py-2.5 pl-11 pr-12 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <button class="absolute right-3 w-7 h-7 rounded-xl bg-white shadow-sm flex items-center justify-center text-emerald-600">
                <i class="fa-solid fa-qrcode text-xs"></i>
            </button>
        </div>
    </div>

    <!-- 3 Categories Grid (Дар боло) -->
    <div class="px-4 mt-3 grid grid-cols-3 gap-2">
        <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 text-center cursor-pointer">
            <div class="bg-gray-100 h-16 rounded-xl flex items-center justify-center text-xl mb-1">🌾</div>
            <span class="text-[11px] font-medium text-gray-700" id="cat1">Зерно</span>
        </div>
        <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 text-center cursor-pointer">
            <div class="bg-gray-100 h-16 rounded-xl flex items-center justify-center text-xl mb-1">🌱</div>
            <span class="text-[11px] font-medium text-gray-700" id="cat2">Удобрения</span>
        </div>
        <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 text-center cursor-pointer">
            <div class="bg-gray-100 h-16 rounded-xl flex items-center justify-center text-xl mb-1">🐓</div>
            <span class="text-[11px] font-medium text-gray-700" id="cat3">Корма</span>
        </div>
    </div>

    <!-- Black/Dark Banner -->
    <main class="px-4 mt-3">
        <div class="bg-gray-900 rounded-3xl p-4 text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <span class="bg-emerald-500 text-white text-[10px] px-2.5 py-0.5 rounded-full font-medium">Скидка 0%</span>
                <h2 class="text-sm font-bold mt-2">Спецпредложение недели</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">Лучшие цены с доставкой.</p>
            </div>
        </div>

        <!-- Filter Buttons (For you / Prices of the day) -->
        <div class="flex space-x-2 mt-4">
            <button class="bg-gray-900 text-white text-xs px-4 py-1.5 rounded-full font-medium" id="tab1">Для вас</button>
            <button class="bg-white text-gray-600 border border-gray-200 text-xs px-4 py-1.5 rounded-full font-medium" id="tab2">Цены дня</button>
        </div>

        <!-- Products Grid (Карточкаҳои борик ва дилчадор) -->
        <div class="grid grid-cols-2 gap-3 mt-3">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between relative">
                <button class="absolute top-4 right-4 text-gray-300 hover:text-red-500"><i class="fa-regular fa-heart"></i></button>
                <div>
                    <div class="bg-gray-100 h-24 rounded-xl flex items-center justify-center text-3xl mb-2">🌾</div>
                    <h3 class="text-xs font-medium text-gray-800" id="p1-title">Пшеница отборная</h3>
                    <p class="text-sm font-bold text-emerald-600 mt-1">3.20 TJS <span class="text-[10px] text-gray-400 font-normal">/ кг</span></p>
                </div>
                <button class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 rounded-xl btn-cart">В корзину</button>
            </div>

            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between relative">
                <button class="absolute top-4 right-4 text-gray-300 hover:text-red-500"><i class="fa-regular fa-heart"></i></button>
                <div>
                    <div class="bg-gray-100 h-24 rounded-xl flex items-center justify-center text-3xl mb-2">🌽</div>
                    <h3 class="text-xs font-medium text-gray-800" id="p2-title">Кукуруза сухая</h3>
                    <p class="text-sm font-bold text-emerald-600 mt-1">2.80 TJS <span class="text-[10px] text-gray-400 font-normal">/ кг</span></p>
                </div>
                <button class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 rounded-xl btn-cart">В корзину</button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-3 flex justify-around items-center z-50 shadow-lg">
        <a href="#" class="flex flex-col items-center text-emerald-600"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] mt-1" id="nav-home">Главная</span></a>
        <a href="#" class="flex flex-col items-center text-gray-400"><i class="fa-solid fa-wallet text-lg"></i><span class="text-[10px] mt-1" id="nav-wallet">Кошелек</span></a>
        <a href="#" class="flex flex-col items-center text-gray-400 relative"><i class="fa-solid fa-cart-shopping text-lg"></i><span class="absolute -top-1 -right-2 bg-emerald-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">2</span><span class="text-[10px] mt-1" id="nav-cart">Корзина</span></a>
        <a href="#" class="flex flex-col items-center text-gray-400"><i class="fa-regular fa-heart text-lg"></i><span class="text-[10px] mt-1" id="nav-fav">Избранное</span></a>
        <a href="#" class="flex flex-col items-center text-gray-400"><i class="fa-solid fa-gear text-lg"></i><span class="text-[10px] mt-1" id="nav-set">Настройки</span></a>
    </nav>

    <script>
        const t = {
            ru: { cat1: "Зерно", cat2: "Удобрения", cat3: "Корма", tab1: "Для вас", tab2: "Цены дня", cart: "В корзину", home: "Главная", wallet: "Кошелек", cartNav: "Корзина", fav: "Избранное", set: "Настройки" },
            tj: { cat1: "Ғалла", cat2: "Нуриҳо", cat3: "Хӯрокворӣ", tab1: "Барои шумо", tab2: "Нархҳои рӯз", cart: "Сабад", home: "Хона", wallet: "Қуттича", cartNav: "Сабад", fav: "Дӯстдошта", set: "Танзимот" },
            uz: { cat1: "Don", cat2: "O'g'it", cat3: "Yem", tab1: "Siz uchun", tab2: "Kun narxlari", cart: "Savatga", home: "Bosh sahifa", wallet: "Hamyon", cartNav: "Savat", fav: "Saralangan", set: "Sozlamalar" }
        };
        function changeLanguage(lang) {
            const d = t[lang];
            document.getElementById('cat1').innerText = d.cat1;
            document.getElementById('cat2').innerText = d.cat2;
            document.getElementById('cat3').innerText = d.cat3;
            document.getElementById('tab1').innerText = d.tab1;
            document.getElementById('tab2').innerText = d.tab2;
            document.getElementById('nav-home').innerText = d.home;
            document.getElementById('nav-wallet').innerText = d.wallet;
            document.getElementById('nav-cart').innerText = d.cartNav;
            document.getElementById('nav-fav').innerText = d.fav;
            document.getElementById('nav-set').innerText = d.set;
            document.querySelectorAll('.btn-cart.btn-cart').forEach(b => b.innerText = d.cart);
        }
    </script>
</body>
</html>
