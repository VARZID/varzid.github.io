<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARZID Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f4f5f7; display: flex; justify-content: center; min-height: 100vh; padding: 10px; }
    .app-card { width: 100%; max-width: 380px; background: #fff; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 740px; position: relative; border: 1px solid #eee; }
    
    /* Header */
    .header { padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 20px; font-weight: 800; color: #111; letter-spacing: 0.5px; }
    .lang-select { padding: 4px 8px; border-radius: 12px; border: 1px solid #ddd; background: #f9f9f9; font-size: 13px; font-weight: 600; cursor: pointer; outline: none; }
    .search-box { position: relative; }
    .search-box input { width: 100%; padding: 10px 14px 10px 36px; border-radius: 16px; border: none; background: #f1f3f5; font-size: 14px; outline: none; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888; font-size: 14px; }
    
    /* Content */
    .content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
    
    /* Banner */
    .banner { background: linear-gradient(135deg, #10b981, #059669); color: #fff; padding: 18px; border-radius: 20px; display: flex; flex-direction: column; gap: 6px; }
    .banner h3 { font-size: 18px; font-weight: 700; }
    .banner p { font-size: 13px; opacity: 0.9; }

    /* Categories */
    .categories { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .cat-chip { background: #f1f3f5; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; color: #444; }
    .cat-chip.active { background: #111; color: #fff; }

    /* Product Grid */
    .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .img-placeholder { width: 100%; height: 110px; background: #e9ecef; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .product-title { font-size: 13px; font-weight: 600; color: #222; }
    .product-price { font-size: 15px; font-weight: 700; color: #10b981; }
    .add-btn { background: #10b981; color: #fff; border: none; padding: 8px; border-radius: 12px; font-weight: 600; font-size: 12px; cursor: pointer; width: 100%; transition: 0.2s; }
    .add-btn:active { transform: scale(0.97); }

    /* Navigation */
    .nav-bar { display: flex; justify-content: space-around; padding: 12px 0; background: #fff; border-top: 1px solid #f0f0f0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #888; font-weight: 500; cursor: pointer; }
    .nav-item.active { color: #10b981; font-weight: 700; }
    .nav-icon { font-size: 18px; }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- Header -->
    <div class="header">
      <div class="top-bar">
        <div class="logo">VARZID</div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
          <option value="ru" selected>RU (Русский)</option>
          <option value="tj">TJ (Тоҷикӣ)</option>
          <option value="uz">UZ (O‘zbekcha)</option>
        </select>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск товаров...">
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Banner -->
      <div class="banner">
        <h3 id="bannerTitle">Скидки до 30%!</h3>
        <p id="bannerDesc">Специальные предложения этой недели.</p>
      </div>

      <!-- Categories -->
      <div class="categories">
        <div class="cat-chip active" id="catAll">Все</div>
        <div class="cat-chip" id="catFeed">Корма</div>
        <div class="cat-chip" id="catGrain">Зерно</div>
        <div class="cat-chip" id="catFertilizers">Удобрения</div>
      </div>

      <!-- Products -->
      <div class="product-grid">
        <div class="product-card">
          <div class="img-placeholder">🌾</div>
          <div class="product-title" id="p1Title">Пшеница отборная</div>
          <div class="product-price">3.20 TJS / кг</div>
          <button class="add-btn" id="p1Btn" onclick="addToCart()">В корзину</button>
        </div>
        <div class="product-card">
          <div class="img-placeholder">🌽</div>
          <div class="product-title" id="p2Title">Кукуруза сухая</div>
          <div class="product-price">2.80 TJS / кг</div>
          <button class="add-btn" id="p2Btn" onclick="addToCart()">В корзину</button>
        </div>
        <div class="product-card">
          <div class="img-placeholder">🌱</div>
          <div class="product-title" id="p3Title">Удобрение Селитра</div>
          <div class="product-price">220 TJS / мешок</div>
          <button class="add-btn" id="p3Btn" onclick="addToCart()">В корзину</button>
        </div>
        <div class="product-card">
          <div class="img-placeholder">🐓</div>
          <div class="product-title" id="p4Title">Комбикорм для птиц</div>
          <div class="product-price">4.50 TJS / кг</div>
          <button class="add-btn" id="p4Btn" onclick="addToCart()">В корзину</button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
      <div class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span id="navHome">Главная</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">📦</span>
        <span id="navCat">Каталог</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">🛒</span>
        <span id="navCart">Корзина</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">👤</span>
        <span id="navProfile">Профиль</span>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      ru: {
        search: "Поиск товаров...",
        bannerTitle: "Скидки до 30%!",
        bannerDesc: "Специальные предложения этой недели.",
        catAll: "Все",
        catFeed: "Корма",
        catGrain: "Зерно",
        catFertilizers: "Удобрения",
        p1Title: "Пшеница отборная",
        p2Title: "Кукуруза сухая",
        p3Title: "Удобрение Селитра",
        p4Title: "Комбикорм для птиц",
        btnText: "В корзину",
        navHome: "Главная",
        navCat: "Каталог",
        navCart: "Корзина",
        navProfile: "Профиль"
      },
      tj: {
        search: "Ҷустуҷӯи маҳсулот...",
        bannerTitle: "То 30% зангдор!",
        bannerDesc: "Пешниҳодҳои махсуси ин ҳафта.",
        catAll: "Ҳама",
        catFeed: "Хӯрокворӣ",
        catGrain: "Ғалладона",
        catFertilizers: "Уғриҳо (Нуриҳо)",
        p1Title: "Биринҷ/Гандуми аъло",
        p2Title: "Маккаи хушк",
        p3Title: "Нуриҳои Селитра",
        p4Title: "Хӯроки парандаҳо",
        btnText: "Ба сабад",
        navHome: "Асосӣ",
        navCat: "Каталог",
        navCart: "Сабад",
        navProfile: "Профил"
      },
      uz: {
        search: "Mahsulotlarni qidirish...",
        bannerTitle: "30% gacha chegirma!",
        bannerDesc: "Bu haftaning maxsus takliflari.",
        catAll: "Barchasi",
        catFeed: "Osh-yem",
        catGrain: "Don mahsulotlari",
        catFertilizers: "O‘g‘itlar",
        p1Title: "Saralangan bug‘doy",
        p2Title: "Quruq makkajo‘xori",
        p3Title: "Selitra o‘g‘iti",
        p4Title: "Parrandalar uchun yem",
        btnText: "Savatga",
        navHome: "Bosh sahifa",
        navCat: "Katalog",
        navCart: "Savat",
        navProfile: "Profil"
      }
    };

    function changeLanguage() {
      const lang = document.getElementById("langSelect").value;
      const t = translations[lang];

      document.getElementById("searchInput").placeholder = t.search;
      document.getElementById("bannerTitle").innerText = t.bannerTitle;
      document.getElementById("bannerDesc").innerText = t.bannerDesc;
      
      document.getElementById("catAll").innerText = t.catAll;
      document.getElementById("catFeed").innerText = t.catFeed;
      document.getElementById("catGrain").innerText = t.catGrain;
      document.getElementById("catFertilizers").innerText = t.catFertilizers;

      document.getElementById("p1Title").innerText = t.p1Title;
      document.getElementById("p2Title").innerText = t.p2Title;
      document.getElementById("p3Title").innerText = t.p3Title;
      document.getElementById("p4Title").innerText = t.p4Title;

      document.getElementById("p1Btn").innerText = t.btnText;
      document.getElementById("p2Btn").innerText = t.btnText;
      document.getElementById("p3Btn").innerText = t.btnText;
      document.getElementById("p4Btn").innerText = t.btnText;

      document.getElementById("navHome").innerText = t.navHome;
      document.getElementById("navCat").innerText = t.navCat;
      document.getElementById("navCart").innerText = t.navCart;
      document.getElementById("navProfile").innerText = t.navProfile;
    }

    function addToCart() {
      alert("Товар добавлен в корзину!");
    }
  </script>
</body>
</html>
