<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZID - Мусобиқаҳои минтақавӣ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>VARZID</h1>
        <p>Мусобиқаҳои футбол миёни гурӯҳҳо</p>
    </header>

    <main class="container">
        <!-- Интихоби гурӯҳҳо -->
        <section class="leagues-section">
            <h2>Гурӯҳҳои мусобиқа</h2>
            <div id="leagueButtons" class="league-grid">
                <!-- Тугмаҳои гурӯҳҳо тавассути JS бор мешаванд -->
            </div>
        </section>

        <!-- Қисми ҷадвал ва бозиҳо -->
        <section id="leagueDetails" class="league-details hidden">
            <h2 id="currentLeagueTitle">Номи Гурӯҳ</h2>
            
            <div class="admin-login-box">
                <input type="password" id="adminCodeInput" placeholder="Коди админро ворид кунед (масалан: 123sharq)">
                <button id="adminLoginBtn">Даромадани Админ</button>
            </div>

            <!-- Панели Админ (дар аввал пинҳон аст) -->
            <div id="adminPanel" class="admin-panel hidden">
                <h3>Панели Идоракунии Админ</h3>
                
                <div class="admin-card">
                    <h4>Илова кардани команда</h4>
                    <input type="text" id="newTeamName" placeholder="Номи команда">
                    <button id="addTeamBtn">Илова кардани команда</button>
                </div>

                <div class="admin-card">
                    <h4>Илова кардани натиҷаи бозӣ (Шот)</h4>
                    <select id="homeTeamSelect"></select>
                    <span>ба</span>
                    <select id="awayTeamSelect"></select>
                    <input type="number" id="homeScore" placeholder="Гӯли мизбон" min="0">
                    <input type="number" id="awayScore" placeholder="Гӯли меҳмон" min="0">
                    <button id="addMatchBtn">Сабти Шот</button>
                </div>
            </div>

            <!-- Ҷадвали мусобиқа -->
            <div class="table-container">
                <h3>Ҷадвали мусобиқа</h3>
                <table id="standingsTable">
                    <thead>
                        <tr>
                            <th>Ҷой</th>
                            <th>Команда</th>
                            <th>Б</th>
                            <th>БР</th>
                            <th>М</th>
                            <th>Ш</th>
                            <th>Т/Ф</th>
                            <th>Хол</th>
                        </tr>
                    </thead>
                    <tbody id="standingsBody">
                        <!-- Маълумоти командаҳо -->
                    </tbody>
                </table>
            </div>

            <button id="backBtn" class="back-btn">← Бозгашт ба рӯйхати гурӯҳҳо</button>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
