<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARZID Marketplace</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f6f8;
      color: #333;
      padding-bottom: 70px;
    }
    header {
      background: #1b4332;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .lang-select {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      background: #fff;
      color: #333;
      cursor: pointer;
    }
    .container {
      max-width: 800px;
      margin: 15px auto;
      padding: 0 10px;
    }
    
    /* Панели админ */
    .admin-card {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      border-left: 5px solid #2d6a4f;
    }
    .admin-card h3 {
      margin-bottom: 12px;
      color: #1b4332;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-grid input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn-add {
      background: #2d6a4f;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-add:hover {
      background: #1b4332;
    }

    /* Рӯйхати маҳсулот */
    .product-card {
      background: white;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .cat-badge {
      background: #e9ecef;
      color: #495057;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .product-title {
      font-size: 16px;
      font-weight: bold;
      color: #222;
    }
    .product-details {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
    .btn-delete {
      background: #e63946;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-delete:hover {
      background: #c1121f;
    }

    /* Навигатсияи поён */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }
    nav.bottom-nav button {
      background: none;
      border: none;
      font-size: 12px;
      color: #555;
      cursor: pointer;
    }

    /* Пинҳон кардани виҷети Google */
    body { top: 0 !important; }
    .goog-te-banner-frame { display: none !important; }
    .skiptranslate { display: none !important; }
  </style>
</head>
<body>

  <!-- Болои сомона бо интихоби забон -->
  <header>
    <div class="logo">VARZID</div>
    <div>
      <select class="lang-select" id="languageSelect" onchange="changeLanguage(this.value)">
        <option value="ru" selected>🇷🇺 RU</option>
        <option value="tj">🇹🇯 TJ</option>
        <option value="en">🇬🇧 EN</option>
        <option value="uz">🇺🇿 UZ</option>
      </select>
    </div>
  </header>

  <div id="google_translate_element" style="display:none;"></div>

  <div class="container">
    
    <!-- Панели админ (Идоракунӣ) -->
    <div class="admin-card">
      <h3>⚙️ Управление товарами</h3>
      <div class="form-grid">
        <input type="text" id="catInput" placeholder="Категория (напр. Зерно)">
        <input type="text" id="nameInput" placeholder="Название товара">
        <input type="number" id="priceInput" placeholder="Цена (сомони)">
        <input type="text" id="weightInput" placeholder="Вес / Фасовка (напр. 50 кг)">
        <input type="number" id="qtyInput" placeholder="Количество (шт/мешок)">
      </div>
      <button class="btn-add" onclick="addProduct()">➕ Добавить товар</button>
    </div>

    <!-- Рӯйхати маҳсулот -->
    <h3 style="margin-bottom: 10px;">📦 Список товаров</h3>
    <div id="productDisplay"></div>

  </div>

  <!-- Навигатсияи поёнӣ -->
  <nav class="bottom-nav">
    <button>🏠 Главная</button>
    <button>📋 Каталог</button>
    <button>🛒 Корзина</button>
    <button onclick="alert('Кабинет клиента: здесь покупатели видят свои заказы.')">👤 Кабинет</button>
  </nav>

  <!-- Скриптҳо -->
  <script type="text/javascript">
    // Хотираи маҳсулот
    let items = JSON.parse(localStorage.getItem('varzid_items')) || [];

    function renderItems() {
      const container = document.getElementById('productDisplay');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p style="color:#777;">Товаров пока нет.</p>';
        return;
      }

      items.forEach((item, index) => {
        container.innerHTML += `
          <div class="product-card">
            <div>
              <span class="cat-badge">${item.category}</span>
              <div class="product-title">${item.name}</div>
              <div class="product-details">
                <strong>Цена:</strong> ${item.price} сомони | 
                <strong>Вес:</strong> ${item.weight} | 
                <strong>Остаток:</strong> ${item.qty} шт.
              </div>
            </div>
            <button class="btn-delete" onclick="deleteItem(${index})">❌ Удалить</button>
          </div>
        `;
      });
    }

    function addProduct() {
      const category = document.getElementById('catInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();
      const price = document.getElementById('priceInput').value.trim();
      const weight = document.getElementById('weightInput').value.trim();
      const qty = document.getElementById('qtyInput').value.trim();

      if (!name || !price) {
        alert('Пожалуйста, введите название и цену товара!');
        return;
      }

      items.push({
        category: category || 'Общее',
        name: name,
        price: price,
        weight: weight || '1 шт',
        qty: qty || '0'
      });

      localStorage.setItem('varzid_items', JSON.stringify(items));
      renderItems();

      // Пок кардани шакл
      document.getElementById('catInput').value = '';
      document.getElementById('nameInput').value = '';
      document.getElementById('priceInput').value = '';
      document.getElementById('weightInput').value = '';
      document.getElementById('qtyInput').value = '';
    }

    function deleteItem(index) {
      const item = items[index];
      const confirmDelete = confirm(`Вы уверены, что хотите удалить "${item.name}"?`);

      if (confirmDelete) {
        items.splice(index, 1);
        localStorage.setItem('varzid_items', JSON.stringify(items));
        renderItems();
      }
    }

    // Танзими тарҷумони Google
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ru',
        includedLanguages: 'ru,tg,en,uz',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function changeLanguage(langCode) {
      if (langCode === 'tj') langCode = 'tg';
      var select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      }
    }

    renderItems();
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
